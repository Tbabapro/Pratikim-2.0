<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6-H’den İngilizce — Gelişmiş AI Platformu</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Fredoka', 'sans-serif'],
          },
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' },
            accent: { pink: '#ec4899', purple: '#a855f7', cyan: '#06b6d4', amber: '#f59e0b', emerald: '#10b981' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Fredoka', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .dark .glass-card {
      background: rgba(30, 27, 75, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .flip-card { perspective: 1000px; }
    .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip-card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 glass-card shadow-md border-b border-indigo-100 dark:border-indigo-950/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- LOGO -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
          <div class="relative flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 text-white font-black text-2xl shadow-lg shadow-indigo-500/30">
            <span>6H</span>
          </div>
          <div>
            <div class="font-heading font-bold text-xl sm:text-2xl tracking-wide bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">
              6-H’den İngilizce
            </div>
            <div class="text-[10px] sm:text-xs text-indigo-500 font-semibold uppercase tracking-wider">
              İnteraktif AI Sürüm
            </div>
          </div>
        </div>

        <!-- DESKTOP MENU -->
        <nav class="hidden xl:flex items-center gap-1">
          <button onclick="navigateTo('home')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-house text-indigo-500"></i> Ana Sayfa</button>
          <button onclick="navigateTo('classes')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-layer-group text-purple-500"></i> Sınıflar</button>
          <button onclick="navigateTo('words')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-book-open text-pink-500"></i> Kelimeler</button>
          <button onclick="navigateTo('tests')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-vial-circle-check text-emerald-500"></i> Testler</button>
          <button onclick="navigateTo('games')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-gamepad text-amber-500"></i> Oyunlar</button>
          <button onclick="navigateTo('ai-chat')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2 text-cyan-600 dark:text-cyan-400 font-bold"><i class="fa-solid fa-robot text-cyan-500"></i> AI Koç</button>
          <button onclick="navigateTo('lgs')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-graduation-cap text-indigo-500"></i> LGS</button>
          <button onclick="navigateTo('profile')" class="px-3 py-2 rounded-xl font-semibold text-sm hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition flex items-center gap-2"><i class="fa-solid fa-user-astronaut text-pink-500"></i> Profil</button>
        </nav>

        <div class="flex items-center gap-3">
          <div class="hidden sm:flex items-center gap-2 bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 px-3 py-1.5 rounded-full font-bold text-xs border border-amber-300 dark:border-amber-800">
            <i class="fa-solid fa-bolt text-amber-500"></i>
            <span id="nav-xp">0 XP</span>
          </div>
          <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-amber-400 flex items-center justify-center">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:block"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="main-content" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-8 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
      6-H’den İngilizce Öğrenme Platformu • MEB Uyumlu İnteraktif Eğitim
    </div>
  </footer>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-indigo-500/30 pointer-events-none">
    <div class="text-xl text-emerald-400"><i class="fa-solid fa-circle-check"></i></div>
    <div id="toast-msg" class="font-medium text-sm">İşlem başarılı!</div>
  </div>

  <script>
    const COURSE_DATA = {
      5: Array.from({ length: 10 }, (_, i) => ({ id: `5-${i+1}`, grade: 5, unitNum: i+1, title: `Unit ${i+1}`, desc: `5. Sınıf ${i+1}. Ünite konuları.` })),
      6: Array.from({ length: 10 }, (_, i) => ({ id: `6-${i+1}`, grade: 6, unitNum: i+1, title: `Unit ${i+1}`, desc: `6. Sınıf ${i+1}. Ünite konuları.` })),
      7: Array.from({ length: 10 }, (_, i) => ({ id: `7-${i+1}`, grade: 7, unitNum: i+1, title: `Unit ${i+1}`, desc: `7. Sınıf ${i+1}. Ünite konuları.` })),
      8: Array.from({ length: 10 }, (_, i) => ({ id: `8-${i+1}`, grade: 8, unitNum: i+1, title: `Unit ${i+1}`, desc: `8. Sınıf LGS ${i+1}. Ünite konuları.` }))
    };

    let userProgress = { xp: 0, level: 1, streak: 3 };

    function loadProgress() {
      const saved = localStorage.getItem("6h_english_user_data_v3");
      if (saved) { try { userProgress = { ...userProgress, ...JSON.parse(saved) }; } catch(e){} }
      updateUIStats();
    }
    function saveProgress() {
      localStorage.setItem("6h_english_user_data_v3", JSON.stringify(userProgress));
      updateUIStats();
    }
    function addXP(amt, reason="") {
      userProgress.xp += amt;
      const newLvl = Math.floor(userProgress.xp / 100) + 1;
      if (newLvl > userProgress.level) {
        userProgress.level = newLvl;
        showToast(`Tebrikler! Seviye ${newLvl} oldun! 🎉`, "success");
      } else if(reason) {
        showToast(`+${amt} XP Kazanıldı (${reason})`, "success");
      }
      saveProgress();
    }
    function updateUIStats() {
      const el = document.getElementById("nav-xp");
      if(el) el.innerText = `${userProgress.xp} XP (Svy ${userProgress.level})`;
    }

    let currentRoute = "home";
    function navigateTo(route, param=null) {
      currentRoute = route;
      const main = document.getElementById("main-content");
      window.scrollTo({ top: 0, behavior: 'smooth' });
      switch(route) {
        case 'home': renderHome(main); break;
        case 'ai-chat': renderAIChatPage(main); break;
        case 'classes': renderClasses(main); break;
        case 'words': renderWordsPage(main); break;
        case 'tests': renderTestsPage(main); break;
        case 'games': renderGamesPage(main); break;
        case 'lgs': renderLGSPage(main); break;
        case 'profile': renderProfilePage(main); break;
        default: renderHome(main);
      }
    }

    function renderHome(container) {
      container.innerHTML = `
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white p-8 sm:p-12 shadow-2xl mb-12">
          <h1 class="text-3xl sm:text-5xl font-black mb-4">6-H'den İngilizce Platformu</h1>
          <p class="text-indigo-100 mb-8">AI Konuşma Koçu ve interaktif ünitelerle İngilizceni geliştir!</p>
          <button onclick="navigateTo('ai-chat')" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-6 py-3.5 rounded-2xl shadow-lg transition"><i class="fa-solid fa-robot"></i> AI Koç ile Konuşmaya Başla</button>
        </div>
      `;
    }

    // AI CHATBOT WITH PRESET BUTTONS AND SMART REPLIES
    function renderAIChatPage(container) {
      container.innerHTML = `
        <div class="mb-6">
          <h1 class="text-3xl font-bold mb-2">🤖 AI İngilizce Konuşma Koçu</h1>
          <p class="text-slate-500 text-sm">Aşağıdaki hazır butonlardan birini seçebilir veya kendi sorunu yazabilirsin!</p>
        </div>

        <div class="glass-card rounded-3xl p-6 shadow-xl max-w-3xl mx-auto flex flex-col h-[520px] border border-slate-200 dark:border-slate-800">
          
          <!-- PRESET TOPIC BUTTONS -->
          <div class="flex flex-wrap gap-2 pb-3 mb-3 border-b border-slate-200 dark:border-slate-800">
            <button onclick="sendPreset('Hello!')" class="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 text-xs font-bold hover:bg-indigo-100 transition">👋 Hello!</button>
            <button onclick="sendPreset('How are you?')" class="px-3 py-1.5 rounded-xl bg-purple-50 dark:bg-purple-950 text-purple-600 dark:text-purple-300 text-xs font-bold hover:bg-purple-100 transition">❓ How are you?</button>
            <button onclick="sendPreset('Bana 6. sınıf konularını anlat')" class="px-3 py-1.5 rounded-xl bg-pink-50 dark:bg-pink-950 text-pink-600 dark:text-pink-300 text-xs font-bold hover:bg-pink-100 transition">📚 6. Sınıf Konuları</button>
            <button onclick="sendPreset('LGS İngilizce için taktik ver')" class="px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-300 text-xs font-bold hover:bg-emerald-100 transition">🎯 LGS Taktiği</button>
            <button onclick="sendPreset('Bana günlük bir İngilizce ipucu ver')" class="px-3 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-300 text-xs font-bold hover:bg-amber-100 transition">💡 İngilizce İpucu</button>
          </div>

          <!-- CHAT MESSAGES BOX -->
          <div id="chat-messages" class="flex-grow overflow-y-auto space-y-4 pr-2 mb-4">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">AI</div>
              <div class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl text-sm max-w-[85%]">
                Hi there! I am your AI English coach. Choose a topic above or type your question below! 🚀
              </div>
            </div>
          </div>

          <!-- INPUT AREA -->
          <div class="flex gap-2">
            <input type="text" id="chat-input" onkeypress="if(event.key==='Enter') sendChatMessage()" placeholder="Mesajını yaz..." class="flex-grow p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:border-indigo-500">
            <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3.5 rounded-2xl font-bold transition"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      `;
    }

    function sendPreset(text) {
      document.getElementById("chat-input").value = text;
      sendChatMessage();
    }

    function sendChatMessage() {
      const input = document.getElementById("chat-input");
      const box = document.getElementById("chat-messages");
      const text = input.value.trim();
      if(!text) return;

      // User Bubble
      box.innerHTML += `
        <div class="flex items-start gap-3 justify-end">
          <div class="bg-indigo-600 text-white p-4 rounded-2xl text-sm max-w-[85%]">${text}</div>
          <div class="w-9 h-9 rounded-xl bg-pink-500 text-white flex items-center justify-center font-bold text-sm">Sen</div>
        </div>
      `;
      input.value = "";
      box.scrollTop = box.scrollHeight;

      // Smart AI Response Logic
      setTimeout(() => {
        let reply = "That's very interesting! Can you tell me more about it in English?";
        const lower = text.toLowerCase();

        if (lower.includes("hello") || lower.includes("hi")) {
          reply = "Hello! It's so nice to talk with you. What would you like to learn today?";
        } else if (lower.includes("how are you")) {
          reply = "I'm doing great, thank you! Ready to help you master English. How are you doing?";
        } else if (lower.includes("6. sınıf") || lower.includes("6th grade")) {
          reply = "In 6th grade, you learn great units like *Life*, *Yummy Breakfast*, *Downtown*, and *Weather and Emotions*. Would you like a vocabulary test for 6th grade?";
        } else if (lower.includes("lgs") || lower.includes("taktik")) {
          reply = "🎯 LGS Taktği: Sınavda özellikle *Accepting & Refusing* (Kabul etme ve reddetme) kalıplarına, *Making offers* (Teklif etme) yapılarına ve *Would you like to...?* sorularına çok dikkat etmelisin!";
        } else if (lower.includes("ipucu") || lower.includes("tip")) {
          reply = "💡 Günlük İpucu: Yeni bir kelime öğrenirken onu sadece Türkçe anlamıyla değil, içinde geçtiği örnek bir cümleyle ezberle. Böylece kalıcılığı 2 katına çıkar!";
        }

        box.innerHTML += `
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">AI</div>
            <div class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl text-sm max-w-[85%]">${reply}</div>
          </div>
        `;
        box.scrollTop = box.scrollHeight;
        addXP(5, "AI Pratiği");
      }, 700);
    }

    function renderClasses(container) { container.innerHTML = `<div class="glass-card p-8 rounded-3xl max-w-xl mx-auto"><h2 class="text-2xl font-bold">Sınıflar & Üniteler</h2></div>`; }
    function renderWordsPage(container) { container.innerHTML = `<div class="glass-card p-8 rounded-3xl max-w-xl mx-auto"><h2 class="text-2xl font-bold">Kelimeler</h2></div>`; }
    function renderTestsPage(container) { container.innerHTML = `<div class="glass-card p-8 rounded-3xl max-w-xl mx-auto"><h2 class="text-2xl font-bold">Testler</h2></div>`; }
    function renderGamesPage(container) { container.innerHTML = `<div class="glass-card p-8 rounded-3xl max-w-xl mx-auto"><h2 class="text-2xl font-bold">Oyunlar</h2></div>`; }
    function renderLGSPage(container) { container.innerHTML = `<div class="glass-card p-8 rounded-3xl max-w-xl mx-auto"><h2 class="text-2xl font-bold">LGS Özel</h2></div>`; }
    function renderProfilePage(container) { container.innerHTML = `<div class="glass-card p-8 rounded-3xl max-w-xl mx-auto"><h2 class="text-2xl font-bold">Profil</h2></div>`; }

    function showToast(msg, type="success") {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => toast.classList.add("translate-y-20", "opacity-0"), 2500);
    }
    function toggleTheme() { document.documentElement.classList.toggle('dark'); }

    window.addEventListener("DOMContentLoaded", () => {
      loadProgress();
      navigateTo('home');
    });
  </script>
</body>
</html>
